[package]
name = "async-http-example"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "http_client"
path = "http_client.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
